[project]
name = "backbone"
version = "0.1.0"
description = "OSM road segment to drivable-surface polygon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas",
    "shapely",
    "rasterio",
    "pyproj",
    "requests",
    "numpy",
    "matplotlib",
    "pyogrio",
    "pillow",
    "affine",
    "scipy",
    "tabulate",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backbone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
