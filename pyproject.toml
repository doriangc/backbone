[project]
name = "backbone"
version = "0.1.0"
description = "OSM road segment to drivable-surface polygon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas",
    "shapely",
    "rasterio",
    "pyproj",
    "requests",
    "numpy",
    "matplotlib",
    "pyogrio",
    "pillow",
    "affine",
    "scipy",
    "tabulate",
    "torch",
    "torchvision",
    "segmentation-models-pytorch>=0.5.0",
]

[dependency-groups]
dev = ["pytest"]

# CPU-only PyTorch wheels: the default Linux wheels pull ~2.5 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backbone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
